<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneMind — Return to Present</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1a0c0c">
</head>
<body>
  <div class="top-controls">
    <div class="top-control-row">
      <div class="breath-session-controls" id="breath-session-controls" hidden>
        <button id="breath-play-pause" class="settings-toggle breath-action-btn" type="button" aria-pressed="false" aria-label="Pause breathing"></button>
        <button id="breath-reset" class="settings-toggle breath-action-btn reset-action-btn" type="button" aria-label="Reset breathing">↺</button>
      </div>
      <button id="settings-toggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel" aria-label="Open settings">⚙</button>
    </div>
    <div id="settings-panel" class="settings-panel" hidden>
    <!-- Přepínač T tématu -->
    <div class="control-group">
      <button id="btn-theme-auto" class="ctrl-btn active" type="button">Auto</button>
      <span class="divider">|</span>
      <button id="btn-theme-dark" class="ctrl-btn" type="button" aria-label="Dark red evening theme">🌙</button>
      <span class="divider">|</span>
      <button id="btn-theme-light" class="ctrl-btn" type="button">☀️</button>
      <span class="divider">|</span>
      <button id="btn-theme-blue" class="ctrl-btn" type="button" aria-label="Blue theme">🔵</button>
    </div>

    <span class="divider">|</span>

    <div class="control-group breath-control">
      <label for="breath-technique" id="breath-technique-label">Technique</label>
      <select id="breath-technique" class="ctrl-select">
        <option value="simple">Simple Cycle</option>
        <option value="relax">Relax and Focus</option>
        <option value="coherence">Coherence</option>
        <option value="tranquility">Tranquility</option>
      </select>
    </div>
    <p class="technique-description" id="technique-description"></p>

    <span class="divider">|</span>

    <div class="control-group sound-control">
      <label for="sound-frequency" id="sound-label">Sound</label>
      <button id="sound-toggle" class="ctrl-btn sound-toggle" type="button" aria-pressed="false" aria-label="Toggle sound">🔇</button>
      <select id="sound-frequency" class="ctrl-select" aria-label="Sound frequency">
        <option value="off">Off</option>
        <option value="brown">Brown Noise (Deep Focus)</option>
        <option value="432">432 Hz</option>
        <option value="528">528 Hz</option>
        <option value="4">4 Hz</option>
      </select>
      <label for="sound-volume" id="volume-label">Volume</label>
      <input id="sound-volume" class="volume-control" type="range" min="0" max="100" value="35" aria-label="Volume">
    </div>

    <span class="divider">|</span>

    <!-- Přepínač Jazyka -->
    <div class="control-group">
      <button id="btn-cs" class="ctrl-btn" type="button">CS</button>
      <span class="divider">|</span>
      <button id="btn-en" class="ctrl-btn" type="button">EN</button>
    </div>

    <span class="divider">|</span>

    <a class="repo-link" href="https://github.com/svpudik/OneMind" target="_blank" rel="noopener noreferrer" aria-label="Open OneMind GitHub repository">GitHub</a>

    </div>
  </div>
  <div id="pull-refresh-indicator" class="pull-refresh-indicator" aria-hidden="true">↓</div>

  <div class="container">
    <div class="breath-circle" id="circle"></div>
    <div class="phase-label" id="phase">...</div>
    <p class="thought-text" id="thought">...</p>
  </div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
