<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneMind — Return to Present</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0b0f19">
</head>
<body>
  <div class="top-controls">
    <!-- Přepínač T tématu -->
    <div class="control-group">
      <button id="btn-theme-auto" class="ctrl-btn active" type="button">Auto</button>
      <span class="divider">|</span>
      <button id="btn-theme-dark" class="ctrl-btn" type="button">🌙</button>
      <span class="divider">|</span>
      <button id="btn-theme-light" class="ctrl-btn" type="button">☀️</button>
    </div>

    <span class="divider">|</span>

    <!-- Přepínač Jazyka -->
    <div class="control-group">
      <button id="btn-cs" class="ctrl-btn" type="button">CS</button>
      <span class="divider">|</span>
      <button id="btn-en" class="ctrl-btn" type="button">EN</button>
    </div>
  </div>

  <div class="container">
    <div class="breath-circle" id="circle"></div>
    <div class="phase-label" id="phase">...</div>
    <p class="thought-text" id="thought">...</p>
  </div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
