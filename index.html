<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneMind — Return to Present</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-controls">
    <!-- Přepínač T tématu -->
    <div class="control-group">
      <button id="btn-theme-auto" class="ctrl-btn active" onclick="setTheme('auto')">Auto</button>
      <span class="divider">|</span>
      <button id="btn-theme-dark" class="ctrl-btn" onclick="setTheme('dark')">🌙</button>
      <span class="divider">|</span>
      <button id="btn-theme-light" class="ctrl-btn" onclick="setTheme('light')">☀️</button>
    </div>

    <span class="divider">|</span>

    <!-- Přepínač Jazyka -->
    <div class="control-group">
      <button id="btn-cs" class="ctrl-btn" onclick="setLanguage('cs')">CS</button>
      <span class="divider">|</span>
      <button id="btn-en" class="ctrl-btn" onclick="setLanguage('en')">EN</button>
    </div>
  </div>

  <div class="container">
    <div class="breath-circle" id="circle"></div>
    <div class="phase-label" id="phase">...</div>
    <p class="thought-text" id="thought">...</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
